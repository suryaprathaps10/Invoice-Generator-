<!DOCTYPE html>
<html>

<head>
  <title>Admin Setup</title>
  <link rel="stylesheet" href="admin.css">
  <script defer src="app.js"></script>
</head>

<body>

  <div class="admin-container">
    <h1>Company Setup</h1>

    <h3>Supplier Details</h3>

    <label>Name</label>
    <input id="aName">

    <label>Address</label>
    <textarea id="aAddress"></textarea>

    <label>GSTIN</label>
    <input id="aGSTIN">

    <label>PAN / IEC</label>
    <input id="aPanIec">

    <label>E-mail id</label>
    <input id="aEmail">

    <label>Phone</label>
    <input id="aPhone">

    <h3>Bank Details</h3>

    <label>Bank Name</label>
    <input id="aBankName">

    <label>Payee Name</label>
    <input id="aPayee">

    <label>Account Number</label>
    <input id="aAccount">

    <label>Branch</label>
    <input id="aBranch">

    <label>Bank Address</label>
    <textarea id="aBankAddress"></textarea>

    <label>IFSC Code</label>
    <input id="aIFSC">

    <label>Swift Code</label>
    <input id="aSwift">

    <h3>Authorised Signatory</h3>

    <label>Name</label>
    <input id="aSignatoryName">

    <label>Designation</label>
    <input id="aSignatoryDesignation">

    <button onclick="saveCompany()">Save</button>
  </div>

</body>

</html>
